name: Build llvmpipe/lavapipe for Winlator (aarch64 glibc)

# Produces TWO separate archives, matching exactly what Winlator Official's
# XServerDisplayActivity.extractGraphicsDriverFiles() actually extracts --
# it treats the Vulkan renderer slot and OpenGL renderer slot as
# independently selectable, so it never extracts one combined archive:
#   llvmpipe-vulkan-<version>.tzst
#     usr/lib/libvulkan_lvp.so                    -> lavapipe Vulkan ICD driver
#     usr/share/vulkan/icd.d/lvp_icd.aarch64.json -> Vulkan loader manifest
#   llvmpipe-opengl-<version>.tzst
#     usr/lib/libGL.so.1.7.0  -> llvmpipe, statically linked into classic
#                                libGL (Xlib GLX target, NOT a separate
#                                dri/*.so plugin)
# Each archive may ALSO conditionally contain usr/lib/libtinfo.so.6 and/or
# usr/lib/libsensors.so.5 -- private bundled copies, added automatically
# only if the produced binary actually links against them (detected via
# readelf after the build). Confirmed by direct inspection of Winlator
# Official's rootfs: every other runtime dependency this driver needs is
# present there, but those two specifically are not, so this is a
# self-healing step rather than a hardcoded assumption either way.
#
# Design notes:
#   - Builds run INSIDE a real aarch64 container via QEMU user-mode emulation
#     (docker/setup-qemu-action), not manual dpkg --add-architecture cross-compiling.
#     This avoids "llvm-config is an arm64 ELF binary and can't run on the amd64
#     runner" entirely, since under emulation it runs as a true native binary.
#   - Base image is ubuntu:22.04 (jammy), a currently-supported LTS with
#     packages verifiably live on ports.ubuntu.com (unlike ubuntu:23.10
#     "mantic", which this workflow tried in an earlier iteration -- mantic
#     is EOL and BOTH ports.ubuntu.com and old-releases.ports.ubuntu.com
#     404 on it, so that path was abandoned rather than guessing a third
#     unverifiable archive URL). jammy ships glibc 2.35, which is NOT an
#     exact match for the glibc 2.38 Winlator Official is understood to use
#     -- but glibc is backward compatible (a 2.35-linked binary loads fine
#     on a 2.38 system, since 2.35's symbol versions are a strict subset of
#     2.38's), so this does not reintroduce the ABI problem that motivated
#     moving off ubuntu:24.04 in an earlier iteration (glibc 2.39, which is
#     NEWER than the target and therefore NOT guaranteed to be a subset).
#     Note also that termux-pacman's own glibc toolchain (a different,
#     related but distinct thing from "glibc 2.38" as a bare version
#     number) hard-patches GCC's linker to bake in Termux's own install
#     prefix (/data/data/com.termux/files/usr) instead of standard /lib and
#     /usr/lib paths -- building against that toolchain directly would
#     import Termux's path assumptions, which do NOT match Winlator's own
#     rootDir-relative filesystem layout, so it was deliberately not adopted
#     even before the mantic archive dead-end appeared.
#   - -Dshared-llvm=false is MANDATORY. Without it, Mesa links against the
#     shared libLLVM-*.so provided by llvm-dev, and Winlator's rootfs does not
#     ship that library at all -- so libGL/libvulkan_lvp fail to dlopen for
#     exactly the same "silent failure, blank GPU info" reason as the glibc
#     mismatch above. Statically linking LLVM's component libraries into the
#     driver removes that runtime dependency entirely (at the cost of a much
#     larger .so, which is expected and correct).
#   - -Dzstd=disabled: falls back to zlib (which is a near-universal baseline
#     dependency and already required unconditionally by Mesa) for disk-cache
#     compression, instead of adding an extra libzstd.so.1 runtime dependency
#     that may not exist in Winlator's rootfs.
#   - glslang-tools is installed via apt for its runtime shared libs, but the
#     glslangValidator BINARY it provides on jammy is too old for Mesa 26.x's
#     hard `glslang >= 12.2` requirement. A current glslangValidator is built
#     from upstream source via its own CMake+Ninja flow (never a bare `make`
#     invocation, which is what broke the earlier turnip pipeline) and
#     installed to /usr/local/bin, which sits ahead of /usr/bin on PATH.
#     Upstream's standalone binary is itself named "glslang" now (the old
#     "glslangValidator" name was dropped), so it's installed under the
#     "glslangValidator" filename Mesa's meson.build actually searches for.
#     Its own test suite and unused SPIRV-Tools CLI tools are disabled via
#     CMake flags to keep this step from eating the job's time budget under
#     QEMU emulation.
#   - -Dglx=xlib is the key option: it embeds the llvmpipe gallium driver
#     directly into libGL.so instead of producing a separate loadable
#     dri/swrast_dri.so, which is what lets the final package be a single
#     self-contained libGL file with no DRI search-path plumbing needed.
#   - -Ddri3 does NOT exist as a meson option in Mesa 26.x -- it was removed
#     upstream as of the 25.0.0 release. An earlier iteration of this
#     workflow tried to pass it to shrink the XCB dependency footprint
#     (libxcb-dri3, libxcb-present, libxcb-sync, libxcb-shm, libX11-xcb),
#     which broke `meson setup` outright ("Unknown option: dri3"). It's
#     removed here. Note this isn't just a syntax fix: even where that
#     option used to exist, it only controlled the OLD-STYLE GLX/DRI2-3
#     loader, not Vulkan's X11 WSI code (src/vulkan/wsi/wsi_common_x11.c),
#     which links those same XCB submodules unconditionally whenever X11
#     Vulkan surface support is compiled in -- so disabling it would likely
#     not have removed the runtime dependency anyway. Whether those XCB
#     submodules are actually present or absent in Winlator's rootfs is
#     still unconfirmed; it was inferred (not verified) from an earlier
#     rootfs dump that was pulled for an unrelated purpose (checking the
#     glibc version), not as a complete library inventory.

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: "Mesa version to build (must exist as mesa-<ver>.tar.xz on archive.mesa3d.org)"
        required: true
        default: "26.0.0"
      llvm_major:
        description: "LLVM major version to build against (jammy ships 15 in its own repos, matching this ABI baseline)"
        required: true
        default: "15"
      vulkan_api_version:
        description: "api_version field written into the lavapipe ICD json"
        required: true
        default: "1.4.335"
      icd_library_path:
        description: "Absolute library_path baked into the ICD json (must match where Winlator extracts libvulkan_lvp.so on-device)"
        required: true
        default: "/data/data/com.winlator/files/imagefs/usr/lib/libvulkan_lvp.so"

env:
  MESA_VERSION: ${{ github.event.inputs.mesa_version || '26.0.0' }}
  LLVM_MAJOR: ${{ github.event.inputs.llvm_major || '15' }}
  VULKAN_API_VERSION: ${{ github.event.inputs.vulkan_api_version || '1.4.335' }}
  ICD_LIBRARY_PATH: ${{ github.event.inputs.icd_library_path || '/data/data/com.winlator/files/imagefs/usr/lib/libvulkan_lvp.so' }}
  TARGET_TRIPLE: aarch64-linux-gnu

jobs:
  build-llvmpipe-lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mandatory: registers binfmt_misc handlers so the amd64 runner can
      # execute aarch64 ELF binaries transparently. Without this every
      # command inside --platform=linux/arm64 below fails with "exec format error".
      - name: Set up QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create output directory
        run: mkdir -p "${{ github.workspace }}/artifacts"

      - name: Write in-container build script
        run: |
          cat > "${{ github.workspace }}/build.sh" <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          MESA_VERSION="${MESA_VERSION:?}"
          LLVM_MAJOR="${LLVM_MAJOR:?}"
          VULKAN_API_VERSION="${VULKAN_API_VERSION:?}"
          ICD_LIBRARY_PATH="${ICD_LIBRARY_PATH:?}"

          echo "==> Updating apt and installing mandatory build dependencies"
          apt-get update
          echo "==> Confirming base image glibc version"
          ldd --version | head -n1 || true
          apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils git \
            build-essential pkg-config cmake ninja-build \
            python3 python3-pip python3-setuptools python3-wheel \
            python3-mako python3-yaml python3-ply \
            bison flex \
            zstd \
            glslang-tools \
            "llvm-${LLVM_MAJOR}-dev" "libclang-cpp${LLVM_MAJOR}-dev" clang-"${LLVM_MAJOR}" \
            libzstd-dev zlib1g-dev libexpat1-dev libelf-dev \
            libdrm-dev \
            libx11-dev libxext-dev libxfixes-dev libxcb1-dev libxcb-glx0-dev \
            libxcb-shm0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libxcb-keysyms1-dev \
            libxshmfence-dev libxxf86vm-dev libxrandr-dev

          # Mesa 26.x needs a meson newer than what jammy packages, so pin a
          # known-good modern meson via pip, installed straight into the
          # system interpreter. Deliberately NOT using `python3 -m venv`,
          # since that needs the separate python3.10-venv package
          # (ensurepip) which isn't installed by default and would be one
          # more thing to keep in sync.
          echo "==> Installing pinned meson via pip (system interpreter)"
          # Deliberately NOT running "pip install --upgrade pip" first: the
          # apt-installed pip has no RECORD metadata (it's a dpkg-managed
          # file set), so pip's self-uninstall step during an upgrade fails
          # with "Cannot uninstall pip 22.0.2, RECORD file not found".
          # Also deliberately NOT passing --break-system-packages: that flag
          # only exists on pip 23.0.1+ (PEP 668 support), and jammy ships
          # pip 22.0.2, which errors with "no such option" if you pass it.
          # jammy has no PEP 668 "externally managed environment" guard in
          # the first place, so a plain install is correct here.
          python3 -m pip install "meson>=1.4,<2.0"
          hash -r
          meson --version

          echo "==> Building glslangValidator from source"
          # jammy's glslang-tools apt package satisfies availability but not
          # Mesa 26.x's version floor (meson.build hard-requires >= 12.2;
          # jammy's packaged build reports older than that). Building from
          # upstream's own CMake+Ninja flow (not a bare `make` invocation,
          # which is what broke the earlier turnip pipeline) avoids both
          # problems at once. Installing to /usr/local/bin means it's found
          # ahead of the apt-provided /usr/bin/glslangValidator on PATH, so
          # no need to uninstall the apt package.
          git clone --depth 1 https://github.com/KhronosGroup/glslang.git /tmp/glslang
          cd /tmp/glslang
          python3 update_glslang_sources.py
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DENABLE_CTEST=OFF \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_SKIP_EXECUTABLES=ON \
            -DENABLE_SPVREMAPPER=OFF \
            -DENABLE_GLSLANG_BINARIES=ON
          ninja -C build
          # Upstream glslang renamed its standalone binary from
          # "glslangValidator" to "glslang" some time ago, but Mesa's
          # meson.build still specifically searches PATH for a program named
          # "glslangValidator" -- so install under that name regardless of
          # what the build actually produced.
          GLSLANG_BIN="$(find build/StandAlone -maxdepth 1 -type f \( -name 'glslang' -o -name 'glslangValidator' \) | head -n1)" || true
          if [ -z "$GLSLANG_BIN" ]; then
            echo "FATAL: no glslang/glslangValidator binary found after build" >&2
            find build/StandAlone -maxdepth 1 -type f >&2
            exit 1
          fi
          install -Dm755 "$GLSLANG_BIN" /usr/local/bin/glslangValidator
          cd / && rm -rf /tmp/glslang
          hash -r
          glslangValidator --version || true

          echo "==> Fetching Mesa ${MESA_VERSION} source"
          mkdir -p /build && cd /build
          curl -fL -o "mesa-${MESA_VERSION}.tar.xz" \
            "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"
          tar xf "mesa-${MESA_VERSION}.tar.xz"
          cd "mesa-${MESA_VERSION}"

          echo "==> Configuring build (single-file classic libGL + lavapipe ICD)"
          # gallium-drivers=llvmpipe -> the only gallium driver being embedded
          # vulkan-drivers=swrast    -> lavapipe Vulkan ICD (libvulkan_lvp.so)
          # glx=xlib                 -> MANDATORY for a single self-contained
          #                             libGL.so: bakes llvmpipe straight into
          #                             libGL instead of a separate dri/*.so
          #                             plugin loaded via DRI search path
          # egl/gbm disabled          -> not part of the 3-file package Winlator
          #                             expects for this driver; omit to avoid
          #                             producing files that won't be shipped
          # llvm=enabled              -> mandatory: llvmpipe JITs shaders via LLVM
          meson setup build \
            --prefix=/output/usr \
            --libdir=lib \
            --buildtype=release \
            -Db_ndebug=true \
            -Dplatforms=x11 \
            -Dgallium-drivers=llvmpipe \
            -Dvulkan-drivers=swrast \
            -Dglx=xlib \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=true \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dshared-glapi=disabled \
            -Dllvm=enabled \
            -Dshared-llvm=false \
            -Dzstd=disabled \
            -Dvalgrind=disabled \
            -Dlibunwind=disabled \
            -Dtools= \
            -Dvulkan-layers=

          echo "==> Building"
          ninja -C build -j"$(nproc)"

          echo "==> Installing to staging root"
          ninja -C build install

          echo "==> Locating build outputs"
          LIBDIR="/output/usr/lib"
          GL_SRC="$(find "$LIBDIR" -maxdepth 1 -name 'libGL.so.*' -type f | sort -V | tail -n1)"
          VK_SRC="${LIBDIR}/libvulkan_lvp.so"
          ICD_SRC="$(find /output -path '*/share/vulkan/icd.d/*.json' | head -n1)" || true

          if [ -z "$GL_SRC" ] || [ ! -f "$GL_SRC" ]; then
            echo "FATAL: no libGL.so.* produced by the xlib GLX target" >&2
            exit 1
          fi
          if [ ! -f "$VK_SRC" ]; then
            echo "FATAL: libvulkan_lvp.so was not produced" >&2
            exit 1
          fi
          if [ -z "$ICD_SRC" ]; then
            echo "FATAL: lavapipe ICD manifest was not produced" >&2
            exit 1
          fi

          echo "==> Assembling the two separate archives Winlator's extraction code expects"
          # XServerDisplayActivity.extractGraphicsDriverFiles() extracts the
          # Vulkan slot and OpenGL slot as two INDEPENDENT archives (since
          # Winlator Official lets Vulkan and OpenGL renderers be picked
          # independently, e.g. Turnip for Vulkan + llvmpipe for OpenGL). A
          # single combined archive is never extracted by that code at all.
          rm -rf /pkg
          mkdir -p /pkg/vulkan/usr/lib /pkg/vulkan/usr/share/vulkan/icd.d
          mkdir -p /pkg/opengl/usr/lib

          cp -a "$GL_SRC" /pkg/opengl/usr/lib/libGL.so.1.7.0
          cp -a "$VK_SRC" /pkg/vulkan/usr/lib/libvulkan_lvp.so

          echo "==> Checking for libtinfo/libsensors and bundling private copies if needed"
          # Confirmed via direct inspection of Winlator Official's rootfs:
          # libtinfo.so.6 and libsensors.so.5 are NOT present there (every
          # other runtime dependency was individually verified present).
          # Rather than guess whether OUR specific build actually links
          # against either one (a different llvmpipe build might have for
          # different reasons -- e.g. a differently-configured static LLVM),
          # detect it directly from the produced binaries and, if so, bundle
          # a private copy alongside our own driver files. This is safe
          # because our own .so files are necessarily already being found on
          # Winlator's library search path (LD_LIBRARY_PATH covers wherever
          # these archives get extracted to) -- co-locating a private copy of
          # a missing dependency there is a standard, well-established
          # technique and does not require Winlator's rootfs to ship it.
          mkdir -p /tmp/extra-libs
          NEEDS_TINFO_GL=0; NEEDS_TINFO_VK=0
          NEEDS_SENSORS_GL=0; NEEDS_SENSORS_VK=0
          if readelf -d /pkg/opengl/usr/lib/libGL.so.1.7.0 | grep -q 'NEEDED.*libtinfo\.so\.6'; then
            NEEDS_TINFO_GL=1
          fi
          if readelf -d /pkg/vulkan/usr/lib/libvulkan_lvp.so | grep -q 'NEEDED.*libtinfo\.so\.6'; then
            NEEDS_TINFO_VK=1
          fi
          if readelf -d /pkg/opengl/usr/lib/libGL.so.1.7.0 | grep -q 'NEEDED.*libsensors\.so\.5'; then
            NEEDS_SENSORS_GL=1
          fi
          if readelf -d /pkg/vulkan/usr/lib/libvulkan_lvp.so | grep -q 'NEEDED.*libsensors\.so\.5'; then
            NEEDS_SENSORS_VK=1
          fi

          echo "libGL needs libtinfo: ${NEEDS_TINFO_GL}, libsensors: ${NEEDS_SENSORS_GL}"
          echo "libvulkan_lvp needs libtinfo: ${NEEDS_TINFO_VK}, libsensors: ${NEEDS_SENSORS_VK}"

          if [ "$NEEDS_TINFO_GL" = "1" ] || [ "$NEEDS_TINFO_VK" = "1" ]; then
            apt-get download libtinfo6
            dpkg-deb -x libtinfo6_*.deb /tmp/extra-libs
            TINFO_SRC="$(find /tmp/extra-libs -name 'libtinfo.so.6' | head -n1)" || true
            if [ -z "$TINFO_SRC" ]; then
              echo "FATAL: libtinfo6 .deb did not contain libtinfo.so.6" >&2
              exit 1
            fi
            if [ "$NEEDS_TINFO_GL" = "1" ]; then
              cp -L "$TINFO_SRC" /pkg/opengl/usr/lib/libtinfo.so.6
            fi
            if [ "$NEEDS_TINFO_VK" = "1" ]; then
              cp -L "$TINFO_SRC" /pkg/vulkan/usr/lib/libtinfo.so.6
            fi
          fi

          if [ "$NEEDS_SENSORS_GL" = "1" ] || [ "$NEEDS_SENSORS_VK" = "1" ]; then
            apt-get download libsensors5
            dpkg-deb -x libsensors5_*.deb /tmp/extra-libs
            SENSORS_SRC="$(find /tmp/extra-libs -name 'libsensors.so.5' | head -n1)" || true
            if [ -z "$SENSORS_SRC" ]; then
              echo "FATAL: libsensors5 .deb did not contain libsensors.so.5" >&2
              exit 1
            fi
            if [ "$NEEDS_SENSORS_GL" = "1" ]; then
              cp -L "$SENSORS_SRC" /pkg/opengl/usr/lib/libsensors.so.5
            fi
            if [ "$NEEDS_SENSORS_VK" = "1" ]; then
              cp -L "$SENSORS_SRC" /pkg/vulkan/usr/lib/libsensors.so.5
            fi
          fi

          cat > /pkg/vulkan/usr/share/vulkan/icd.d/lvp_icd.aarch64.json <<EOF
          {
              "ICD": {
                  "api_version": "${VULKAN_API_VERSION}",
                  "library_path": "${ICD_LIBRARY_PATH}"
              },
              "file_format_version": "1.0.0"
          }
          EOF

          echo "==> Verifying each package's file count"
          VK_COUNT="$(find /pkg/vulkan -type f | wc -l)"
          GL_COUNT="$(find /pkg/opengl -type f | wc -l)"
          # Baseline is 2 files for vulkan (driver + icd json), 1 for opengl
          # (driver), plus one extra file for each of libtinfo/libsensors
          # that got conditionally bundled above.
          VK_EXPECTED=$((2 + NEEDS_TINFO_VK + NEEDS_SENSORS_VK))
          GL_EXPECTED=$((1 + NEEDS_TINFO_GL + NEEDS_SENSORS_GL))
          if [ "$VK_COUNT" -ne "$VK_EXPECTED" ]; then
            echo "FATAL: vulkan package expected ${VK_EXPECTED} files, found ${VK_COUNT}" >&2
            find /pkg/vulkan -type f >&2
            exit 1
          fi
          if [ "$GL_COUNT" -ne "$GL_EXPECTED" ]; then
            echo "FATAL: opengl package expected ${GL_EXPECTED} files, found ${GL_COUNT}" >&2
            find /pkg/opengl -type f >&2
            exit 1
          fi

          echo "==> Packaging as two .tzst archives"
          cd /pkg/vulkan
          tar --zstd -cf "/artifacts/llvmpipe-vulkan-${MESA_VERSION}.tzst" $(find . -type f -printf '%P\n')
          sha256sum "/artifacts/llvmpipe-vulkan-${MESA_VERSION}.tzst" \
            > "/artifacts/llvmpipe-vulkan-${MESA_VERSION}.tzst.sha256"

          cd /pkg/opengl
          tar --zstd -cf "/artifacts/llvmpipe-opengl-${MESA_VERSION}.tzst" $(find . -type f -printf '%P\n')
          sha256sum "/artifacts/llvmpipe-opengl-${MESA_VERSION}.tzst" \
            > "/artifacts/llvmpipe-opengl-${MESA_VERSION}.tzst.sha256"

          echo "==> Contents of both archives:"
          tar --zstd -tvf "/artifacts/llvmpipe-vulkan-${MESA_VERSION}.tzst"
          tar --zstd -tvf "/artifacts/llvmpipe-opengl-${MESA_VERSION}.tzst"

          echo "==> Done"
          ls -lh /artifacts
          BUILD_SCRIPT
          chmod +x "${{ github.workspace }}/build.sh"

      - name: Build inside emulated aarch64 ubuntu:22.04 container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -e MESA_VERSION="${{ env.MESA_VERSION }}" \
            -e LLVM_MAJOR="${{ env.LLVM_MAJOR }}" \
            -e VULKAN_API_VERSION="${{ env.VULKAN_API_VERSION }}" \
            -e ICD_LIBRARY_PATH="${{ env.ICD_LIBRARY_PATH }}" \
            -v "${{ github.workspace }}/build.sh:/build.sh:ro" \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            ubuntu:22.04 \
            bash /build.sh

      - name: Verify both archives are well-formed with correct file counts
        run: |
          VK_FILE="artifacts/llvmpipe-vulkan-${{ env.MESA_VERSION }}.tzst"
          GL_FILE="artifacts/llvmpipe-opengl-${{ env.MESA_VERSION }}.tzst"
          for FILE in "$VK_FILE" "$GL_FILE"; do
            test -s "$FILE"
            zstd -t "$FILE"
          done
          VK_COUNT="$(tar --zstd -tf "$VK_FILE" | wc -l)"
          GL_COUNT="$(tar --zstd -tf "$GL_FILE" | wc -l)"
          if [ "$VK_COUNT" -ne 2 ]; then
            echo "FATAL: vulkan archive has ${VK_COUNT} entries, expected 2" >&2
            tar --zstd -tvf "$VK_FILE"
            exit 1
          fi
          if [ "$GL_COUNT" -ne 1 ]; then
            echo "FATAL: opengl archive has ${GL_COUNT} entries, expected 1" >&2
            tar --zstd -tvf "$GL_FILE"
            exit 1
          fi
          echo "vulkan archive OK: $(du -h "$VK_FILE" | cut -f1), 2 entries"
          echo "opengl archive OK: $(du -h "$GL_FILE" | cut -f1), 1 entry"

      - name: Diagnose ABI compatibility of produced binaries
        run: |
          mkdir -p /tmp/abi-check
          tar --zstd -xf "artifacts/llvmpipe-vulkan-${{ env.MESA_VERSION }}.tzst" -C /tmp/abi-check
          tar --zstd -xf "artifacts/llvmpipe-opengl-${{ env.MESA_VERSION }}.tzst" -C /tmp/abi-check
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu > /dev/null
          for f in /tmp/abi-check/usr/lib/libvulkan_lvp.so /tmp/abi-check/usr/lib/libGL.so.1.7.0; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            echo "NEEDED (runtime library dependencies):"
            aarch64-linux-gnu-readelf -d "$f" | grep NEEDED || true
            echo "Max GLIBC symbol version required:"
            aarch64-linux-gnu-objdump -T "$f" 2>/dev/null | grep -oP 'GLIBC_[0-9.]+' | sort -V -u | tail -1 || true
            echo "Max GLIBCXX symbol version required:"
            aarch64-linux-gnu-objdump -T "$f" 2>/dev/null | grep -oP 'GLIBCXX_[0-9.]+' | sort -V -u | tail -1 || true
            if aarch64-linux-gnu-readelf -d "$f" | grep -qi 'NEEDED.*libLLVM'; then
              echo "FATAL: $f still depends on a shared libLLVM -- -Dshared-llvm=false did not take effect" >&2
              exit 1
            fi
            echo ""
          done

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvmpipe-${{ env.MESA_VERSION }}-aarch64
          path: |
            artifacts/llvmpipe-vulkan-${{ env.MESA_VERSION }}.tzst
