name: Build llvmpipe/lavapipe for Winlator (aarch64 glibc)

# Produces exactly 3 files, matching the Turnip/Zink/VirGL packaging convention
# used by Winlator Official's imagefs layout:
#   usr/lib/libGL.so.1.7.0                  -> llvmpipe, statically linked into
#                                              classic libGL (Xlib GLX target,
#                                              NOT a separate dri/*.so plugin)
#   usr/lib/libvulkan_lvp.so                -> lavapipe Vulkan ICD driver
#   usr/share/vulkan/icd.d/lvp_icd.aarch64.json -> Vulkan loader manifest
#
# Design notes:
#   - Builds run INSIDE a real aarch64 container via QEMU user-mode emulation
#     (docker/setup-qemu-action), not manual dpkg --add-architecture cross-compiling.
#     This avoids "llvm-config is an arm64 ELF binary and can't run on the amd64
#     runner" entirely, since under emulation it runs as a true native binary.
#   - Base image is ubuntu:24.04 (noble): ships Python 3.12 and LLVM 18 by
#     default, both already satisfying Mesa 26.x's minimums, so no deadsnakes
#     and no from-source LLVM/Python build.
#   - glslang is NOT built — it is not a dependency of llvmpipe/lavapipe.
#   - -Dglx=xlib is the key option: it embeds the llvmpipe gallium driver
#     directly into libGL.so instead of producing a separate loadable
#     dri/swrast_dri.so, which is what lets the final package be a single
#     self-contained libGL file with no DRI search-path plumbing needed.

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: "Mesa version to build (must exist as mesa-<ver>.tar.xz on archive.mesa3d.org)"
        required: true
        default: "26.0.0"
      llvm_major:
        description: "LLVM major version to build against (noble ships 18 by default)"
        required: true
        default: "18"
      package_name:
        description: "Base filename for the produced driver archive"
        required: true
        default: "llvmpipe-mesa"
      vulkan_api_version:
        description: "api_version field written into the lavapipe ICD json"
        required: true
        default: "1.4.335"
      icd_library_path:
        description: "Absolute library_path baked into the ICD json (must match where Winlator extracts libvulkan_lvp.so on-device)"
        required: true
        default: "/data/data/com.winlator/files/imagefs/usr/lib/libvulkan_lvp.so"

env:
  MESA_VERSION: ${{ github.event.inputs.mesa_version || '26.0.0' }}
  LLVM_MAJOR: ${{ github.event.inputs.llvm_major || '18' }}
  PACKAGE_NAME: ${{ github.event.inputs.package_name || 'llvmpipe-mesa' }}
  VULKAN_API_VERSION: ${{ github.event.inputs.vulkan_api_version || '1.4.335' }}
  ICD_LIBRARY_PATH: ${{ github.event.inputs.icd_library_path || '/data/data/com.winlator/files/imagefs/usr/lib/libvulkan_lvp.so' }}
  TARGET_TRIPLE: aarch64-linux-gnu

jobs:
  build-llvmpipe-lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mandatory: registers binfmt_misc handlers so the amd64 runner can
      # execute aarch64 ELF binaries transparently. Without this every
      # command inside --platform=linux/arm64 below fails with "exec format error".
      - name: Set up QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create output directory
        run: mkdir -p "${{ github.workspace }}/artifacts"

      - name: Write in-container build script
        run: |
          cat > "${{ github.workspace }}/build.sh" <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          MESA_VERSION="${MESA_VERSION:?}"
          LLVM_MAJOR="${LLVM_MAJOR:?}"
          VULKAN_API_VERSION="${VULKAN_API_VERSION:?}"
          ICD_LIBRARY_PATH="${ICD_LIBRARY_PATH:?}"

          echo "==> Updating apt and installing mandatory build dependencies"
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils git \
            build-essential pkg-config cmake ninja-build \
            python3 python3-pip python3-setuptools python3-wheel \
            python3-mako python3-yaml python3-ply \
            bison flex \
            zstd \
            "llvm-${LLVM_MAJOR}-dev" "libclang-cpp${LLVM_MAJOR}-dev" clang-"${LLVM_MAJOR}" \
            libzstd-dev zlib1g-dev libexpat1-dev libelf-dev \
            libdrm-dev \
            libx11-dev libxext-dev libxfixes-dev libxcb1-dev libxcb-glx0-dev \
            libxcb-shm0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxshmfence-dev libxxf86vm-dev libxrandr-dev

          # Mandatory: Ubuntu 24.04's packaged meson can be older than what
          # Mesa 26.x requires. Pin a known-good modern meson via pip,
          # installed straight into the system interpreter with
          # --break-system-packages (safe here: this is a disposable
          # container, not a machine anyone else depends on). Deliberately
          # NOT using `python3 -m venv`, since that needs the separate
          # python3.12-venv package (ensurepip) which isn't installed by
          # default and would be one more thing to keep in sync.
          echo "==> Installing pinned meson via pip (system interpreter)"
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages "meson>=1.4,<2.0"
          hash -r
          meson --version

          echo "==> Fetching Mesa ${MESA_VERSION} source"
          mkdir -p /build && cd /build
          curl -fL -o "mesa-${MESA_VERSION}.tar.xz" \
            "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"
          tar xf "mesa-${MESA_VERSION}.tar.xz"
          cd "mesa-${MESA_VERSION}"

          echo "==> Configuring build (single-file classic libGL + lavapipe ICD)"
          # gallium-drivers=llvmpipe -> the only gallium driver being embedded
          # vulkan-drivers=swrast    -> lavapipe Vulkan ICD (libvulkan_lvp.so)
          # glx=xlib                 -> MANDATORY for a single self-contained
          #                             libGL.so: bakes llvmpipe straight into
          #                             libGL instead of a separate dri/*.so
          #                             plugin loaded via DRI search path
          # egl/gbm disabled          -> not part of the 3-file package Winlator
          #                             expects for this driver; omit to avoid
          #                             producing files that won't be shipped
          # llvm=enabled              -> mandatory: llvmpipe JITs shaders via LLVM
          meson setup build \
            --prefix=/output/usr \
            --libdir=lib \
            --buildtype=release \
            -Db_ndebug=true \
            -Dplatforms=x11 \
            -Dgallium-drivers=llvmpipe \
            -Dvulkan-drivers=swrast \
            -Dglx=xlib \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=true \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dshared-glapi=disabled \
            -Dllvm=enabled \
            -Dvalgrind=disabled \
            -Dlibunwind=disabled \
            -Dtools= \
            -Dvulkan-layers=

          echo "==> Building"
          ninja -C build -j"$(nproc)"

          echo "==> Installing to staging root"
          ninja -C build install

          echo "==> Locating build outputs"
          LIBDIR="/output/usr/lib"
          GL_SRC="$(find "$LIBDIR" -maxdepth 1 -name 'libGL.so.*' -type f | sort -V | tail -n1)"
          VK_SRC="${LIBDIR}/libvulkan_lvp.so"
          ICD_SRC="$(find /output -path '*/share/vulkan/icd.d/*.json' | head -n1)"

          if [ -z "$GL_SRC" ] || [ ! -f "$GL_SRC" ]; then
            echo "FATAL: no libGL.so.* produced by the xlib GLX target" >&2
            exit 1
          fi
          if [ ! -f "$VK_SRC" ]; then
            echo "FATAL: libvulkan_lvp.so was not produced" >&2
            exit 1
          fi
          if [ -z "$ICD_SRC" ]; then
            echo "FATAL: lavapipe ICD manifest was not produced" >&2
            exit 1
          fi

          echo "==> Assembling the exact 3-file package Winlator expects"
          rm -rf /pkg
          mkdir -p /pkg/usr/lib /pkg/usr/share/vulkan/icd.d

          # Rename to the exact filename Winlator's other drivers (Zink,
          # VirGL) use, regardless of Mesa's actual generated soname.
          cp -a "$GL_SRC" /pkg/usr/lib/libGL.so.1.7.0
          cp -a "$VK_SRC" /pkg/usr/lib/libvulkan_lvp.so

          # Hand-written to match exactly what Winlator's Vulkan loader expects,
          # rather than trusting whatever relative path Mesa's build wrote.
          cat > /pkg/usr/share/vulkan/icd.d/lvp_icd.aarch64.json <<EOF
          {
              "ICD": {
                  "api_version": "${VULKAN_API_VERSION}",
                  "library_path": "${ICD_LIBRARY_PATH}"
              },
              "file_format_version": "1.0.0"
          }
          EOF

          echo "==> Verifying package contains EXACTLY 3 files"
          FILE_COUNT="$(find /pkg -type f | wc -l)"
          if [ "$FILE_COUNT" -ne 3 ]; then
            echo "FATAL: expected exactly 3 files in package, found ${FILE_COUNT}:" >&2
            find /pkg -type f >&2
            exit 1
          fi
          find /pkg -type f -exec ls -lh {} \;

          echo "==> Packaging as .tzst (tar + zstd)"
          cd /pkg
          tar --zstd -cf "/artifacts/${PACKAGE_NAME}-${MESA_VERSION}-aarch64.tzst" \
            usr/lib/libGL.so.1.7.0 \
            usr/lib/libvulkan_lvp.so \
            usr/share/vulkan/icd.d/lvp_icd.aarch64.json
          sha256sum "/artifacts/${PACKAGE_NAME}-${MESA_VERSION}-aarch64.tzst" \
            > "/artifacts/${PACKAGE_NAME}-${MESA_VERSION}-aarch64.tzst.sha256"

          echo "==> Contents of final archive:"
          tar --zstd -tvf "/artifacts/${PACKAGE_NAME}-${MESA_VERSION}-aarch64.tzst"

          echo "==> Done"
          ls -lh /artifacts
          BUILD_SCRIPT
          chmod +x "${{ github.workspace }}/build.sh"

      - name: Build inside emulated aarch64 ubuntu:24.04 container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -e MESA_VERSION="${{ env.MESA_VERSION }}" \
            -e LLVM_MAJOR="${{ env.LLVM_MAJOR }}" \
            -e PACKAGE_NAME="${{ env.PACKAGE_NAME }}" \
            -e VULKAN_API_VERSION="${{ env.VULKAN_API_VERSION }}" \
            -e ICD_LIBRARY_PATH="${{ env.ICD_LIBRARY_PATH }}" \
            -v "${{ github.workspace }}/build.sh:/build.sh:ro" \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            ubuntu:24.04 \
            bash /build.sh

      - name: Verify archive is well-formed and has exactly 3 entries
        run: |
          FILE="artifacts/${{ env.PACKAGE_NAME }}-${{ env.MESA_VERSION }}-aarch64.tzst"
          test -s "$FILE"
          zstd -t "$FILE"
          ENTRY_COUNT="$(tar --zstd -tf "$FILE" | wc -l)"
          if [ "$ENTRY_COUNT" -ne 3 ]; then
            echo "FATAL: archive has ${ENTRY_COUNT} entries, expected 3" >&2
            tar --zstd -tvf "$FILE"
            exit 1
          fi
          echo "Archive OK: $(du -h "$FILE" | cut -f1), 3 entries confirmed"

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ env.MESA_VERSION }}-aarch64
          path: |
            artifacts/${{ env.PACKAGE_NAME }}-${{ env.MESA_VERSION }}-aarch64.tzst
            artifacts/${{ env.PACKAGE_NAME }}-${{ env.MESA_VERSION }}-aarch64.tzst.sha256
          if-no-files-found: error
          retention-days: 30
