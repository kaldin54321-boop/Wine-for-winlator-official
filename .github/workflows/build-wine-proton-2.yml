name: Wine and Proton 无bootBuilder

on:
  schedule:
    # Proton 构建 - 每月1号和15号
    - cron: '0 0 1,15 * *'
    # Wine 构建 - 每月5号和20号
    - cron: '0 2 5,20 * *'
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择构建类型'
        required: true
        default: 'proton'
        type: choice
        options:
        - proton
        - wine-wow64
      proton_branch:
        description: 'Proton 分支 (仅 Proton 构建)'
        required: false
        default: 'proton_10.0'
        type: choice
        options:
        - proton_10.0
        - proton_9.0
        - experimental_10.0
        - bleeding-edge
      wine_branch:
        description: 'Wine 分支 (仅 Wine 构建) - vanilla 会应用 Winlator/Android 定向补丁（server-dir 重定向 + mfplat dxgi 修复，见构建日志），使上游 wine 能兼容 Winlator mod'
        required: false
        default: 'vanilla'
        type: choice
        options:
        - vanilla
        - staging
        - staging-tkg
        - staging-tkg-fsync
      wine_version:
        description: 'Wine 版本 (vanilla/staging/tkg 分支使用)，例如 10.15（与已验证可用的 wine-10.15.whp 对齐）'
        required: false
        default: '10.15'
        type: string

env:
  USE_CCACHE: true
  BUILD_DIR: /tmp/build_wine

permissions:
  contents: write  # 允许 GITHUB_TOKEN 创建 Release

jobs:
  build-proton:
    # 与 wine 任务一致使用 ubuntu-22.04：24.04 的 glibc（2.39）比 Winlator
    # rootfs 内置 glibc 新，产物会依赖 rootfs 中不存在的 GLIBC_2.3x 符号，
    # 导致 wine 在 Android 上启动即因动态链接器错误退出。
    runs-on: ubuntu-22.04
    if: github.event.inputs.build_type == 'proton' || (github.event_name == 'schedule' && github.event.schedule == '0 0 1,15 * *')
    timeout-minutes: 180
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装构建依赖
        run: |
          sudo apt update
          # 先修复损坏的依赖
          sudo apt --fix-broken install -y
          
          # 基础构建依赖
          BASE_DEPS="\
            debootstrap \
            perl \
            git \
            wget \
            xz-utils \
            bubblewrap \
            autoconf \
            flex \
            bison \
            gcc-multilib \
            g++-multilib \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxxf86vm-dev \
            libxrender-dev \
            libxinerama-dev \
            libgl-dev \
            libsdl2-dev \
            libglu-dev \
            libosmesa6-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libpcap-dev \
            libdbus-1-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libcups2-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libxml2-dev \
            libvulkan-dev \
            vulkan-tools \
            libvulkan1 \
            mesa-vulkan-drivers \
            mingw-w64 \
            gettext \
            libgettextpo-dev \
            locales \
            language-pack-zh-hans"
          
          sudo apt install -y $BASE_DEPS

      - name: 安装多媒体和音频依赖
        run: |
            sudo apt update
            # 安装完整的 GStreamer
            sudo apt install -y \
              libunwind-dev \
              libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev \
              gstreamer1.0-* \
              libmpg123-dev \
              libopenal-dev

      - name: 设置中文语言环境
        run: |
          sudo locale-gen zh_CN.UTF-8
          sudo update-locale LANG=zh_CN.UTF-8
          export LANG=zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8

      - name: 构建 Proton WOW64 版本
        run: |
            set -e
            
            echo "开始构建 Proton WOW64 版本..."
            echo "分支: ${{ github.event.inputs.proton_branch || 'proton_10.0' }}"
            
            # 设置中文构建环境
            export LANG=zh_CN.UTF-8
            export LC_ALL=zh_CN.UTF-8
            export LANGUAGE=zh_CN:zh:en_US:en
            
            # 清理并创建构建目录
            rm -rf $BUILD_DIR/proton
            mkdir -p $BUILD_DIR/proton
            cd $BUILD_DIR/proton
            
            # 克隆 Proton 源码
            git clone https://github.com/ValveSoftware/wine
            cd wine
            
            # 切换到指定的 Proton 分支
            PROTON_BRANCH="${{ github.event.inputs.proton_branch || 'proton_10.0' }}"
            echo "切换到分支: $PROTON_BRANCH"
            git checkout $PROTON_BRANCH
            
            # Winlator server-dir 定向补丁：只改 server-dir 字面量所在的源文件
            #（对齐已验证的 wine-10.15.whp：硬编码
            # /data/data/com.winlator/files/rootfs/tmp/.wine-%u）。
            # 不做全树 /tmp/ 替换，避免误伤无关路径。注意旧路径曾用
            # .../rootfs/usr/tmp，正确位置是 .../rootfs/tmp。
            echo "应用 Winlator server-dir 定向补丁..."
            WINLATOR_TMPDIR="/data/data/com.winlator/files/rootfs/tmp"
            for f in server/server.c server/request.c dlls/ntdll/unix/server.c; do
              if [ -f "$f" ] && grep -q '"/tmp/\.wine-' "$f"; then
                sed -i "s|\"/tmp/\.wine-|\"${WINLATOR_TMPDIR}/.wine-|g" "$f" && \
                  echo "  已重定向 $f"
              else
                echo "  跳过 $f（不存在或无字面量，运行时 patcher 兜底）"
              fi
            done
          
            echo "路径修复完成"
            
            # 生成 configure 脚本
            echo "生成 configure 脚本..."
            ./autogen.sh
            
            # 配置和构建真正的 WOW64 Proton
            mkdir -p build-wow64
            cd build-wow64
            
            export CROSSCC="x86_64-w64-mingw32-gcc"
            export CROSSCXX="x86_64-w64-mingw32-g++"
            export CFLAGS="-march=x86-64 -msse3 -mfpmath=sse -O3 -ftree-vectorize -pipe"
            export CXXFLAGS="-march=x86-64 -msse3 -mfpmath=sse -O3 -ftree-vectorize -pipe"
            export CROSSCFLAGS="-march=x86-64 -msse3 -mfpmath=sse -O3 -ftree-vectorize -pipe"
            export CROSSCXXFLAGS="-march=x86-64 -msse3 -mfpmath=sse -O3 -ftree-vectorize -pipe"

            # 配置真正的 WOW64 Proton，启用 Vulkan 和完整 GStreamer 支持，禁用 Steam 特定功能
            ../configure \
              --enable-win64 \
              --enable-archs=i386,x86_64 \
              --prefix=/tmp/wine-install-proton \
              --with-x \
              --with-vulkan \
              --with-alsa \
              --with-pulse \
              --with-freetype \
              --with-fontconfig \
              --with-gstreamer \
              --with-gettext \
              --with-sdl \
              --enable-nls \
              --disable-winemenubuilder \
              --disable-win16 \
              --disable-tests \
              --without-ldap \
              --without-capi \
              --without-oss \
              --without-cups \
              --without-dbus \
              --without-coreaudio \
              --without-gphoto \
              --without-osmesa \
              --without-sane \
              --without-pcap \
              --without-pcsclite \
              --without-udev \
              --without-unwind \
              --without-usb \
              --without-v4l2 \
              --without-wayland

            # 构建真正的 WOW64 Proton
            echo "开始构建支持 Vulkan 和完整 GStreamer 的 WOW64 Proton..."
            make -j$(nproc)
            make install
            
            cd ../..
            
            # 获取版本信息
            VERSION_PROTON=$(cd wine && git describe --tags --abbrev=0 2>/dev/null || echo "$PROTON_BRANCH")
            COMMIT_HASH=$(cd wine && git rev-parse --short HEAD)
            PROTON_VERSION="${VERSION_PROTON}-${COMMIT_HASH}"
            echo "PROTON_VERSION=$PROTON_VERSION" >> $GITHUB_ENV
            echo "BUILD_NAME=proton-${PROTON_VERSION}-wow64-xuser" >> $GITHUB_ENV

      - name: 准备打包
        run: |
          # 创建打包目录
          PACKAGE_NAME="${{ env.BUILD_NAME }}"
          mkdir -p wine-package/$PACKAGE_NAME
          
          # 复制 Wine 安装文件
          echo "复制 Wine 文件到 $PACKAGE_NAME..."
          cp -r /tmp/wine-install-proton/* wine-package/$PACKAGE_NAME/

      - name: 创建打包文件
        run: |
          PACKAGE_NAME="${{ env.BUILD_NAME }}"
          
          echo "最终文件结构:"
          find wine-package -type f | sort | head -20
          
          # 使用 XZ 打包并命名为 .whp（与已验证的 wine-10.15.whp 一致：tar.xz 改名）
          XZ_OPT="-9 -T0" tar -cJf $PACKAGE_NAME.whp -C wine-package $PACKAGE_NAME
          
          echo "打包完成:"
          ls -lh *.whp

      - name: Generate checksums
        run: |
          cd $GITHUB_WORKSPACE
          sha256sum *.whp > checksums.txt
          cat checksums.txt

      - name: Upload Proton artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Proton-${{ github.event.inputs.proton_branch || 'proton_10.0' }}-WoW64-xuser
          path: |
            ${{ github.workspace }}/*.whp
            ${{ github.workspace }}/checksums.txt
          retention-days: 30

      - name: 发布 Proton 到 GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'proton'
        with:
          tag_name: proton-${{ github.event.inputs.proton_branch || 'proton_10.0' }}-wow64-xuser
          name: Proton ${{ github.event.inputs.proton_branch || 'proton_10.0' }} (WOW64 with Vulkan & GStreamer for Termux - xuser)
          body: |
            # Proton ${{ github.event.inputs.proton_branch || 'proton_10.0' }} - WOW64 with Vulkan & GStreamer for Termux (xuser)
            
            ## 版本信息
            - **Proton 分支**: ${{ github.event.inputs.proton_branch || 'proton_10.0' }}
            - **架构**: True WOW64 (同时支持 32 位和 64 位 Windows 应用程序)
            - **平台**: Termux (Android)
            - **图形 API**: Vulkan 支持已启用
            - **多媒体**: 完整 GStreamer 支持
            - **用户名**: xuser (已移除 Steam 优化)
            
            ## 特性
            ✓ 真正的 WOW64 架构
            ✓ 同时支持 32 位和 64 位 Windows 应用程序
            ✓ Vulkan 图形 API 支持
            ✓ 完整的 GStreamer 支持
            ✓ 中文环境支持
            ✓ 基于 Valve Proton，但移除了 Steam 特定优化
            ✓ 默认用户名改为 xuser
            
            ## 重要变更
            - 所有对 `steamuser` 的引用已改为 `xuser`
            - 移除了 Steam 特定的优化和组件
            - 更适合通用 Windows 应用程序运行
            
            ## 安装说明
            解压后，将 `${{ env.BUILD_NAME }}` 文件夹放置在 Termux 的合适位置，并设置环境变量。

            ## 构建信息
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交: ${{ github.sha }}
            - 工作流: ${{ github.workflow }}
          files: |
            ${{ github.workspace }}/${{ env.BUILD_NAME }}.whp
            ${{ github.workspace }}/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wine-wow64:
    # 重要：使用 ubuntu-22.04（而非 24.04）编译。24.04 的 glibc（2.39）比 Winlator
    # 官方 rootfs 内置的 glibc 版本新，用 24.04 编译出的 wine 二进制文件会依赖
    # rootfs 中不存在的 GLIBC_2.3x/2.38/2.39 符号版本。这种情况下 wine 进程会在
    # 启动阶段直接因动态链接器错误退出（不会有清晰的错误提示），表现出来就是
    # "容器无法进入桌面 / 一直返回容器主菜单"。22.04 的 glibc 更旧，产物向前兼容。
    runs-on: ubuntu-22.04
    if: github.event.inputs.build_type == 'wine-wow64' || (github.event_name == 'schedule' && github.event.schedule == '0 2 5,20 * *')
    timeout-minutes: 180
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装构建依赖
        run: |
          sudo apt update
          # 先修复损坏的依赖
          sudo apt --fix-broken install -y
          
          # 基础构建依赖
          BASE_DEPS="\
            debootstrap \
            perl \
            git \
            wget \
            xz-utils \
            bubblewrap \
            autoconf \
            flex \
            bison \
            gcc-multilib \
            g++-multilib \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxxf86vm-dev \
            libxrender-dev \
            libxinerama-dev \
            libgl-dev \
            libsdl2-dev \
            libglu-dev \
            libosmesa6-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libpcap-dev \
            libdbus-1-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libcups2-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libxml2-dev \
            libvulkan-dev \
            vulkan-tools \
            libvulkan1 \
            mesa-vulkan-drivers \
            mingw-w64 \
            gettext \
            libgettextpo-dev \
            locales \
            language-pack-zh-hans"
          
          sudo apt install -y $BASE_DEPS

      - name: 安装多媒体和音频依赖
        run: |
            sudo apt update
            # 安装完整的 GStreamer
            sudo apt install -y \
              libunwind-dev \
              libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev \
              libgstreamer-plugins-good1.0-dev \
              libgstreamer-plugins-bad1.0-dev \
              gstreamer1.0-* \
              libmpg123-dev \
              libopenal-dev \
              libfaad-dev \
              libflac-dev \
              libvorbis-dev \
              libx264-dev \
              libx265-dev \
              libvpx-dev \
              libtheora-dev

      - name: 设置中文语言环境
        run: |
          sudo locale-gen zh_CN.UTF-8
          sudo update-locale LANG=zh_CN.UTF-8
          export LANG=zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8

      - name: 构建 Wine WOW64 版本
        run: |
          set -e
          
          # 设置环境变量
          export WINE_BRANCH="${{ github.event.inputs.wine_branch || 'vanilla' }}"
          export WINE_VERSION="${{ github.event.inputs.wine_version || 'latest' }}"
          export BUILD_DIR="/tmp/build_wine_${WINE_BRANCH}_${WINE_VERSION}"
          
          echo "开始构建 Wine WOW64 版本..."
          echo "分支: $WINE_BRANCH"
          echo "版本: $WINE_VERSION"
          
          # 设置中文构建环境
          export LANG=zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8
          export LANGUAGE=zh_CN:zh:en_US:en
          
          # 清理并创建构建目录
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          
          # 根据分支获取 Wine 源码
          if [ "$WINE_BRANCH" = "staging-tkg" ] || [ "$WINE_BRANCH" = "staging-tkg-fsync" ]; then
            # TKG 系列处理 - 修复目录结构问题
            echo "处理 TKG 系列分支: $WINE_BRANCH"
            
            if [ "$WINE_BRANCH" = "staging-tkg" ]; then
              git clone https://github.com/Kron4ek/wine-tkg.git wine-tkg
              SOURCE_DIR="wine-tkg"
            else
              git clone https://github.com/Kron4ek/wine-tkg.git wine-tkg -b fsync
              SOURCE_DIR="wine-tkg"
            fi
            
            cd "$SOURCE_DIR"
            
            # 检查对应的版本标签或分支
            if [ "$WINE_VERSION" != "latest" ]; then
              if git checkout "$WINE_VERSION" 2>/dev/null || git checkout "wine-$WINE_VERSION" 2>/dev/null; then
                echo "成功切换到版本 $WINE_VERSION"
              else
                echo "使用默认分支"
                git checkout master
              fi
            fi
            
            # TKG 版本获取方式
            if [ -f "VERSION" ]; then
              WINE_VERSION_ACTUAL="$(cat VERSION | tail -c +14)"
              echo "从 VERSION 文件获取版本: $WINE_VERSION_ACTUAL"
            else
              WINE_VERSION_ACTUAL=$(git describe --tags --abbrev=0 2>/dev/null || echo "$WINE_VERSION")
              echo "从 git 标签获取版本: $WINE_VERSION_ACTUAL"
            fi
            
            COMMIT_HASH=$(git rev-parse --short HEAD)
            BUILD_NAME="wine-${WINE_VERSION_ACTUAL}-${WINE_BRANCH}-wow64"
            
            echo "TKG 构建信息:"
            echo "  - 版本: $WINE_VERSION_ACTUAL"
            echo "  - 分支: $WINE_BRANCH"
            echo "  - 提交: $COMMIT_HASH"
            echo "  - 构建名称: $BUILD_NAME"
            
          elif [ "$WINE_BRANCH" = "staging" ]; then
            # 原有的 staging 分支处理
            echo "处理 Staging 分支"
            git clone https://github.com/wine-mirror/wine.git wine
            SOURCE_DIR="wine"
            cd "$SOURCE_DIR"
            
            # 关闭 detached HEAD 建议
            git config advice.detachedHead false
            
            if [ "$WINE_VERSION" != "latest" ]; then
              git checkout "wine-$WINE_VERSION"
            fi
            WINE_VERSION_ACTUAL=$(git describe --tags --abbrev=0 2>/dev/null || echo "$WINE_VERSION")
            # git describe 返回 wine-10.15 形式：剥掉 wine- 前缀后再组装 BUILD_NAME，
            # 否则会得到 wine-wine-10.15-... 的双前缀，Winlator 解析出的 version 会错乱
            PURE_VERSION=$(echo "$WINE_VERSION_ACTUAL" | sed 's/^wine-//')
            BUILD_NAME="wine-${PURE_VERSION}-staging-wow64"
            
            # 使用正确的版本格式：vX.Y 而不是 wine-X.Y
            STAGING_VERSION="v${PURE_VERSION}"
            echo "尝试下载 staging 补丁版本: $STAGING_VERSION"
            
            # 下载并应用 staging 补丁 - 修复版本格式
            wget -O "wine-staging-${PURE_VERSION}.tar.gz" "https://github.com/wine-staging/wine-staging/archive/refs/tags/${STAGING_VERSION}.tar.gz" || \
            wget -O "wine-staging-${PURE_VERSION}.tar.gz" "https://github.com/wine-staging/wine-staging/archive/refs/tags/v${PURE_VERSION}.tar.gz"
            
            if [ -f "wine-staging-${PURE_VERSION}.tar.gz" ]; then
              tar -xzf "wine-staging-${PURE_VERSION}.tar.gz"
              
              # 应用 staging 补丁 - 修复目录名检查逻辑
              echo "查找解压后的 staging 目录..."
              ls -la
              
              # 根据 build-wine-test.yml 的正确逻辑
              if [ -d "wine-staging-${PURE_VERSION}" ]; then
                echo "找到目录: wine-staging-${PURE_VERSION}"
                cd "wine-staging-${PURE_VERSION}/staging"
                chmod +x patchinstall.py
                ./patchinstall.py --all --destdir=../../
                cd "../.."
              elif [ -d "wine-staging-v${PURE_VERSION}" ]; then
                echo "找到目录: wine-staging-v${PURE_VERSION}"
                cd "wine-staging-v${PURE_VERSION}/staging"
                chmod +x patchinstall.py
                ./patchinstall.py --all --destdir=../../
                cd "../.."
              elif [ -d "wine-staging-${STAGING_VERSION}" ]; then
                echo "找到目录: wine-staging-${STAGING_VERSION}"
                cd "wine-staging-${STAGING_VERSION}/staging"
                chmod +x patchinstall.py
                ./patchinstall.py --all --destdir=../../
                cd "../.."
              else
                echo "警告: 未找到预期的 staging 目录结构，尝试自动查找..."
                # 尝试查找任何包含 staging 的目录
                STAGING_DIR=$(find . -maxdepth 1 -type d -name "*staging*" | head -1)
                if [ -n "$STAGING_DIR" ] && [ -d "$STAGING_DIR/staging" ]; then
                  echo "找到 staging 目录: $STAGING_DIR"
                  cd "$STAGING_DIR/staging"
                  chmod +x patchinstall.py
                  ./patchinstall.py --all --destdir=../../
                  cd "../.."
                else
                  echo "❌ 错误：无法找到 staging 补丁目录，跳过补丁应用"
                  echo "当前目录内容:"
                  ls -la
                fi
              fi
            else
              echo "警告: 无法下载 staging 补丁，继续构建无补丁版本"
            fi
            
          elif [ "$WINE_BRANCH" = "vanilla" ]; then
            # vanilla 分支：上游 wine 源码 + Winlator/Android 定向补丁。
            # 参考已验证可用的 wine-10.15.whp
            # (kaldin54321-boop/Wine-for-winlator-official)：其 wineserver 与
            # lib/wine/x86_64-unix/ntdll.so 均硬编码
            # /data/data/com.winlator/files/rootfs/tmp/.wine-%u，且为 WoW64 布局
            # （lib/wine/x86_64-unix + i386/x86_64-windows，无 i386-unix）。
            # 具体的 server-dir 重定向与 mfplat 修复在下方公共段以定向方式应用。
            echo "处理 Vanilla 分支"
            git clone https://github.com/wine-mirror/wine.git wine
            SOURCE_DIR="wine"
            cd "$SOURCE_DIR"
            
            # 关闭 detached HEAD 建议
            git config advice.detachedHead false
            
            if [ "$WINE_VERSION" != "latest" ]; then
              git checkout "wine-$WINE_VERSION"
            fi
            WINE_VERSION_ACTUAL=$(git describe --tags --abbrev=0 2>/dev/null || echo "$WINE_VERSION")
            # 剥掉 wine- 前缀，避免 wine-wine-10.15-... 双前缀（见 staging 分支注释）
            PURE_VERSION=$(echo "$WINE_VERSION_ACTUAL" | sed 's/^wine-//')
            BUILD_NAME="wine-${PURE_VERSION}-vanilla-wow64"
            echo "Wine 版本: $WINE_VERSION_ACTUAL，构建名称: $BUILD_NAME"
            
          else
            echo "未知的 Wine 分支: $WINE_BRANCH"
            exit 1
          fi
          
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "当前源码目录: $(pwd)"
          echo "构建名称: $BUILD_NAME"
          
          # Winlator/Android 定向补丁（适用于 vanilla 与 staging）：
          # 已验证可用的 wine-10.15.whp 把 wineserver / ntdll 中的 server-dir 字面量
          # 硬编码为 /data/data/com.winlator/files/rootfs/tmp/.wine-%u。
          # 这里只改这两处字面量所在的源文件，不再全树替换 /tmp/（全树替换会误伤
          # 无关路径/注释/测试，是之前构建不稳定的主要来源之一）。
          # 注意：App 端 WineServerDirPatcher 会在容器启动时对漏网的 stock 构建
          # 做二进制级重定向，所以这里是 belt-and-suspenders，即使某版本文件名
          # 变化也只记警告而不中断构建。
          echo "应用 Winlator server-dir 定向补丁..."
          WINLATOR_TMPDIR="/data/data/com.winlator/files/rootfs/tmp"
          for f in server/server.c server/request.c dlls/ntdll/unix/server.c; do
            if [ -f "$f" ] && grep -q '"/tmp/\.wine-' "$f"; then
              sed -i "s|\"/tmp/\.wine-|\"${WINLATOR_TMPDIR}/.wine-|g" "$f" && \
                echo "  已重定向 $f"
            else
              echo "  跳过 $f（不存在或无 /tmp/.wine- 字面量，运行时 patcher 会兜底）"
            fi
          done
          echo "server-dir 定向补丁完成"
          
          # mfplat/dxgi 修复：按纯数字版本号选择补丁（9.10+ 与以下版本路径不同）。
          # PURE_VERSION 在各分支已求出；若解析不出数字版本则跳过此步而非中断构建。
          if [ -z "${PURE_VERSION:-}" ]; then
            PURE_VERSION=$(echo "${WINE_VERSION_ACTUAL:-$WINE_VERSION}" | sed 's/^wine-//')
          fi
          VERSION_MAJOR=$(echo "$PURE_VERSION" | cut -d. -f1)
          VERSION_MINOR=$(echo "$PURE_VERSION" | cut -d. -f2)
          echo "Wine 版本: ${WINE_VERSION_ACTUAL:-$WINE_VERSION}"
          echo "纯版本号: $PURE_VERSION"
            
            # 判断版本是否 >= 9.10（非数字版本如 latest 则跳过 mfplat 补丁，不中断构建）
          if ! echo "$VERSION_MAJOR" | grep -qE '^[0-9]+$'; then
            echo "⚠️ 无法解析数字版本号 ($PURE_VERSION)，跳过 mfplat 补丁"
          elif [ "$VERSION_MAJOR" -gt 9 ] || { [ "$VERSION_MAJOR" -eq 9 ] && [ "${VERSION_MINOR:-0}" -ge 10 ]; }; then
            echo "使用 9.10+ 版本的修复方式 (wine_do_not_create_dxgi_manager2.patch)"
            if wget -O wine_do_not_create_dxgi_manager2.patch https://github.com/afeimod/linbox/raw/main/path/wine_do_not_create_dxgi_manager2.patch; then
              if [ -f "dlls/mfplat/main.c" ]; then
                echo "找到目标文件 dlls/mfplat/main.c，准备应用补丁..."
                if patch -p1 < wine_do_not_create_dxgi_manager2.patch; then
                  echo "✅ 补丁应用成功"
                else
                  echo "⚠️ mfplat 补丁未能应用（上游代码已变化），继续构建"
                fi
              else
                echo "⚠️ dlls/mfplat/main.c 不存在，跳过 mfplat 补丁"
              fi
            else
              echo "⚠️ mfplat 补丁下载失败，跳过（不中断构建）"
            fi
          else
            echo "使用 9.10 以下版本的修复方式 (fix_wine9.2_mfplat.sh)"
            if wget -O fix_wine9.2_mfplat.sh https://github.com/afeimod/linbox/raw/main/path/fix_wine9.2_mfplat.sh; then
              chmod +x fix_wine9.2_mfplat.sh
              ./fix_wine9.2_mfplat.sh
              echo "✅ 9.10 以下版本修复完成"
            else
              echo "⚠️ 修复脚本下载失败，跳过（不中断构建）"
            fi
          fi
          
          # git 克隆的 wine 源码不像 release tarball 那样自带生成好的 configure 脚本，
          # 上面打的补丁也可能改动了 configure.ac，所以这里统一（重新）生成一次，
          # 避免出现 configure 缺失或与补丁后的 configure.ac 不一致的问题
          if [ ! -x ./configure ] || [ configure.ac -nt configure ]; then
            echo "生成/更新 configure 脚本..."
            autoreconf -f
          fi
          
          # 配置和构建真正的 WOW64 Wine
          mkdir -p build-wow64
          cd build-wow64
          
          export CROSSCC="x86_64-w64-mingw32-gcc"
          export CROSSCXX="x86_64-w64-mingw32-g++"
          export CFLAGS="-march=x86-64 -msse3 -mfpmath=sse -O3 -ftree-vectorize -pipe"
          export CXXFLAGS="-march=x86-64 -msse3 -mfpmath=sse -O3 -ftree-vectorize -pipe"
          export CROSSCFLAGS="-march=x86-64 -msse3 -mfpmath=sse -O3 -ftree-vectorize -pipe"
          export CROSSCXXFLAGS="-march=x86-64 -msse3 -mfpmath=sse -O3 -ftree-vectorize -pipe"

          # 配置真正的 WOW64 Wine，启用 Vulkan 和完整 GStreamer 支持
          ../configure \
            --enable-win64 \
            --enable-archs=i386,x86_64 \
            --prefix=/tmp/wine-install-wow64 \
            --with-x \
            --with-vulkan \
            --with-alsa \
            --with-pulse \
            --with-freetype \
            --with-fontconfig \
            --with-gstreamer \
            --with-gettext \
            --with-sdl \
            --enable-nls \
            --disable-winemenubuilder \
            --disable-win16 \
            --disable-tests \
            --without-ldap \
            --without-capi \
            --without-oss \
            --without-cups \
            --without-dbus \
            --without-coreaudio \
            --without-gphoto \
            --without-osmesa \
            --without-sane \
            --without-pcap \
            --without-pcsclite \
            --without-udev \
            --without-unwind \
            --without-usb \
            --without-v4l2 \
            --without-wayland

          # 构建真正的 WOW64 Wine
          echo "开始构建支持 Vulkan 和完整 GStreamer 的 WOW64 Wine..."
          make -j$(nproc)
          make install

      - name: 准备打包
        run: |
          # 创建打包目录
          PACKAGE_NAME="${{ env.BUILD_NAME }}"
          mkdir -p wine-package/$PACKAGE_NAME
          
          # 复制 Wine 安装文件
          echo "复制 Wine 文件到 $PACKAGE_NAME..."
          cp -r /tmp/wine-install-wow64/* wine-package/$PACKAGE_NAME/

      - name: 校验 Wine 安装树（对齐 App 端 WineInstaller 检查）
        run: |
          set -e
          PACKAGE_NAME="${{ env.BUILD_NAME }}"
          WINE_ROOT="wine-package/$PACKAGE_NAME"
          echo "校验 $WINE_ROOT ..."
          test -f "$WINE_ROOT/bin/wine" || { echo "❌ 缺少 bin/wine"; exit 1; }
          test -f "$WINE_ROOT/bin/wineserver" || { echo "❌ 缺少 bin/wineserver"; exit 1; }
          test -s "$WINE_ROOT/bin/wineserver" || { echo "❌ wineserver 为空"; exit 1; }
          # 64 位能力：x86_64-unix 目录或 64 位 ELF loader（对应 is64BitCapableWineRoot）
          if [ ! -d "$WINE_ROOT/lib/wine/x86_64-unix" ] && [ ! -d "$WINE_ROOT/lib64/wine/x86_64-unix" ]; then
            if ! python3 -c "import sys; d=open('$WINE_ROOT/bin/wine','rb').read(64); sys.exit(0 if d[4]==2 and d[18]==62 else 1)"; then
              echo "❌ 非 64 位 capable 构建（无 x86_64-unix 且 bin/wine 非 x86_64 ELF）"; exit 1
            fi
          fi
          # ntdll 后端必须存在且非空（对应 isInstalledWineRootValid）
          if [ -f "$WINE_ROOT/lib/wine/x86_64-unix/ntdll.so" ]; then
            test -s "$WINE_ROOT/lib/wine/x86_64-unix/ntdll.so" || { echo "❌ ntdll.so 为空（hardlink 丢失式损坏）"; exit 1; }
          elif [ -f "$WINE_ROOT/lib64/wine/x86_64-unix/ntdll.so" ]; then
            test -s "$WINE_ROOT/lib64/wine/x86_64-unix/ntdll.so" || { echo "❌ ntdll.so 为空（hardlink 丢失式损坏）"; exit 1; }
          else
            echo "❌ 缺少 x86_64-unix/ntdll.so"; exit 1
          fi
          # 空文件扫描：unix lib 目录下超过 5 个 0 字节文件即视为损坏
          EMPTY_COUNT=$(find "$WINE_ROOT/lib" "$WINE_ROOT/lib64" -path "*x86_64-unix*" -type f -size 0 2>/dev/null | wc -l)
          echo "空文件数(x86_64-unix): $EMPTY_COUNT"
          [ "$EMPTY_COUNT" -le 5 ] || { echo "❌ 空文件过多，判定为损坏的提取树"; exit 1; }
          # WoW64 布局确认：应有 32 位 PE 而无 32 位 unix lib（对应 hasBuiltInWoW64）
          if [ -d "$WINE_ROOT/lib/wine/i386-windows" ] && [ ! -d "$WINE_ROOT/lib/wine/i386-unix" ]; then
            echo "✅ WoW64 布局确认（i386-windows 且无 i386-unix）"
          else
            echo "⚠️ 非典型 WoW64 布局，继续打包（App 会按 identifier/loader 兜底）"
          fi
          # server-dir 字面量确认：wineserver 与 ntdll.so 应指向 Winlator rootfs tmp
          if grep -q "data/data/com.winlator/files/rootfs/tmp/.wine-" "$WINE_ROOT/bin/wineserver" 2>/dev/null; then
            echo "✅ wineserver server-dir 已重定向"
          else
            echo "⚠️ wineserver 无 Winlator server-dir 字面量（运行时 WineServerDirPatcher 会兜底）"
          fi
          echo "✅ 校验通过"

      - name: 创建打包文件
        run: |
          PACKAGE_NAME="${{ env.BUILD_NAME }}"
          
          echo "最终文件结构:"
          find wine-package -type f | sort | head -20
          
          # 用 XZ 打包并命名为 .whp —— 与已验证可用的 wine-10.15.whp 一致
          #（实测该文件 magic 为 XZ: fd 37 7a 58 5a 00，即 tar.xz 改名而来；
          # App 端 extractWHPArchive 按 ZSTD → XZ → ZIP 顺序尝试，两者都可装，
          # 但 XZ 与参考文件完全一致，兼容性最好）
          XZ_OPT="-9 -T0" tar -cJf "$PACKAGE_NAME.whp" -C wine-package "$PACKAGE_NAME"
          
          echo "打包完成:"
          ls -lh *.whp

      - name: Generate checksums
        run: |
          cd $GITHUB_WORKSPACE
          sha256sum *.whp > checksums.txt
          cat checksums.txt

      - name: Upload Wine WoW64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wine-${{ github.event.inputs.wine_branch || 'vanilla' }}-${{ github.event.inputs.wine_version || 'latest' }}-WoW64
          path: |
            ${{ github.workspace }}/*.whp
            ${{ github.workspace }}/checksums.txt
          retention-days: 30

      - name: 发布 Wine 到 GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'wine-wow64'
        with:
          tag_name: wine-${{ github.event.inputs.wine_branch || 'vanilla' }}-${{ github.event.inputs.wine_version || 'latest' }}-wow64
          name: Wine ${{ github.event.inputs.wine_branch || 'vanilla' }} ${{ github.event.inputs.wine_version || 'latest' }} (WOW64 with Vulkan & GStreamer)
          body: |
            # Wine ${{ github.event.inputs.wine_branch || 'vanilla' }} ${{ github.event.inputs.wine_version || 'latest' }} - WOW64 with Vulkan & GStreamer

            ## 版本信息
            - **Wine 分支**: ${{ github.event.inputs.wine_branch || 'vanilla' }}
            - **Wine 版本**: ${{ github.event.inputs.wine_version || 'latest' }}
            - **架构**: True WOW64 (同时支持 32 位和 64 位 Windows 应用程序)
            - **图形 API**: Vulkan 支持已启用
            - **多媒体**: 完整 GStreamer 支持

            ## 特性
            ✓ 真正的 WOW64 架构
            ✓ 同时支持 32 位和 64 位 Windows 应用程序
            ✓ Vulkan 图形 API 支持
            ✓ 完整的 GStreamer 支持
            ✓ 中文环境支持
            ✓ server-dir 已重定向到 Winlator rootfs tmp（对齐已验证的 wine-10.15.whp），
              stock 构建漏网时 App 端 WineServerDirPatcher 会在启动时二进制级兜底

            ## 安装说明（Winlator App 内导入）
            1. 打开 Winlator → 菜单 → Settings（设置）
            2. 在 "Installed Wine Versions" 区域，点击 "Install Wine Version"
            3. 选择本 Release 中的 `${{ env.BUILD_NAME }}.whp` 文件
               （文件本质为 tar.xz，与已验证的 wine-10.15.whp 格式一致）
            4. Winlator 会解压并校验（bin/wine、wineserver、x86_64-unix/ntdll.so），
               完成后在容器设置中将 Wine Version 切换为新版本
            5. 若容器启动回退到主菜单，优先检查该 Wine 目录的上述三件套是否存在/非空

            压缩包内的顶层目录名即 `${{ env.BUILD_NAME }}`，
            遵循 Winlator 的版本识别规则（wine-<数字版本>[-<子版本>]），可被正确识别。

            ## 构建信息
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交: ${{ github.sha }}
            - 工作流: ${{ github.workflow }}
          files: |
            ${{ github.workspace }}/${{ env.BUILD_NAME }}.whp
            ${{ github.workspace }}/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
