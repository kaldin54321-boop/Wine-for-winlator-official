name: Build LLVMpipe Driver (Mesa)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version to build'
        required: true
        default: '24.1.0'

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesa
        run: |
          # Use official GitLab source to bypass 'Repository not found' errors on GitHub mirror
          git clone --depth 1 --branch mesa-${{ github.event.inputs.mesa_version }} https://gitlab.freedesktop.org/mesa/mesa.git .

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build build-essential \
            python3-mako python3-pip libexpat1-dev libz-dev \
            llvm-17-dev clang-17 libunwind-dev zstd \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libdrm-dev wayland-protocols libwayland-dev

      - name: Setup Termux-Glibc Toolchain
        run: |
          mkdir -p ${{ github.workspace }}/toolchain
          
          # The 403 Forbidden is caused by server-side blocking of default wget/curl agents.
          # We use a full browser User-Agent and multiple mirror attempts.
          # We also disable 'exit on error' (-e) for the download attempts to allow falling back.
          
          DOWNLOAD_SUCCESS=false
          MIRRORS=(
            "https://service.termux-pacman.dev/gpkg/aarch64/glibc-2.38-11-aarch64.pkg.tar.zst"
            "https://ftp.agdsn.de/pub/mirrors/termux/gpkg/aarch64/glibc-2.38-11-aarch64.pkg.tar.zst"
            "https://mirror.isoc.org.il/pub/termux/gpkg/aarch64/glibc-2.38-11-aarch64.pkg.tar.zst"
          )
          
          for url in "${MIRRORS[@]}"; do
            echo "Attempting to download glibc from: $url"
            if curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               --connect-timeout 30 --retry 3 -f "$url" -o glibc.tar.zst; then
              echo "Download successful!"
              DOWNLOAD_SUCCESS=true
              break
            fi
            echo "Failed to download from $url"
          done
          
          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "Error: All mirrors returned 403 Forbidden or were unreachable."
            exit 1
          fi
          
          tar -I zstd -xf glibc.tar.zst -C ${{ github.workspace }}/toolchain
          rm glibc.tar.zst

      - name: Configure Mesa (LLVMpipe)
        run: |
          cat <<EOF > cross-aarch64.txt
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'
          llvm-config = '/usr/bin/llvm-config-17'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          sys_root = '${{ github.workspace }}/toolchain'
          c_args = ['-I${{ github.workspace }}/toolchain/usr/include']
          cpp_args = ['-I${{ github.workspace }}/toolchain/usr/include']
          link_args = ['-L${{ github.workspace }}/toolchain/usr/lib', '-Wl,-rpath-link,${{ github.workspace }}/toolchain/usr/lib']
          EOF

          meson setup build \
            --cross-file cross-aarch64.txt \
            --prefix=/usr \
            -Dplatforms=x11,surfaceless \
            -Dgallium-drivers=swrast \
            -Dvulkan-drivers=swrast \
            -Dllvm=enabled \
            -Dshared-llvm=disabled \
            -Dbuildtype=release \
            -Degl=enabled \
            -Dgbm=enabled \
            -Dopengl=true \
            -Dosmesa=true

      - name: Build and Package
        run: |
          ninja -C build
          
          # --- OpenGL LLVMpipe ---
          # Winlator expects the driver to be named llvmpipe_dri.so in usr/lib
          mkdir -p output/opengl/usr/lib
          if [ -f build/src/gallium/targets/dri/swrast_dri.so ]; then
            cp build/src/gallium/targets/dri/swrast_dri.so output/opengl/usr/lib/llvmpipe_dri.so
          else
            cp build/src/gallium/targets/dri/libgallium_dri.so output/opengl/usr/lib/llvmpipe_dri.so
          fi
          
          # Mesa Fix: Add necessary symlinks for OpenGL compatibility
          ln -s llvmpipe_dri.so output/opengl/usr/lib/swrast_dri.so
          
          cd output/opengl && tar -cf - . | zstd -22 > ../llvmpipe-opengl-${{ github.event.inputs.mesa_version }}.tzst && cd ..

          # --- Vulkan LLVMpipe (Lavapipe) ---
          # Winlator expects lvp_icd.aarch64.json in usr/share/vulkan/icd.d/
          mkdir -p output/vulkan/usr/lib output/vulkan/usr/share/vulkan/icd.d
          cp build/src/gallium/targets/lavapipe/libvulkan_lvp.so output/vulkan/usr/lib/libvulkan_lvp.so
          
          # Generate the ICD JSON (The critical "Mesa fix" for loading Vulkan software rendering on Android)
          # library_path must point to the relative location of the .so file
          cat <<EOF > output/vulkan/usr/share/vulkan/icd.d/lvp_icd.aarch64.json
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "../../../lib/libvulkan_lvp.so",
                  "api_version": "1.3.255"
              }
          }
          EOF
          
          cd output/vulkan && tar -cf - . | zstd -22 > ../llvmpipe-vulkan-${{ github.event.inputs.mesa_version }}.tzst && cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvmpipe-drivers
          path: "*.tzst"
