name: Build LLVMpipe Driver (Mesa)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version to build'
        required: true
        default: '24.1.0'

jobs:
  build-aarch64:
    # Use Ubuntu 22.04 (Jammy) to ensure glibc 2.35 compatibility.
    # This is compatible with Winlator's glibc 2.38+ environment.
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout Mesa
        run: |
          git clone --depth 1 --branch mesa-${{ github.event.inputs.mesa_version }} https://gitlab.freedesktop.org/mesa/mesa.git .

      - name: Setup Multi-arch and Install Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          
          # Fix: Standard Ubuntu mirrors (archive.ubuntu.com) do not host arm64 packages.
          # We must restrict them to amd64 and add ports.ubuntu.com for arm64.
          sudo sed -i 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d/ -type f -name "*.list" -exec sed -i 's/^deb http/deb [arch=amd64] http/g' {} +
          
          cat <<EOF | sudo tee /etc/apt/sources.list.d/arm64.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          
          sudo apt-get update
          
          # Install cross-compiler and target architecture (arm64) libraries.
          sudo apt-get install -y \
            meson ninja-build build-essential flex bison pkg-config python3-mako \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libdrm-dev:arm64 libwayland-dev:arm64 libexpat1-dev:arm64 \
            libx11-dev:arm64 libxext-dev:arm64 libxfixes-dev:arm64 \
            libxcb1-dev:arm64 libxdamage-dev:arm64 libxshmfence-dev:arm64 \
            libxxf86vm-dev:arm64 libedit-dev:arm64 llvm-15-dev:arm64 \
            libunwind-dev:arm64 zlib1g-dev:arm64 zstd

      - name: Apply Mesa "SHM/Android" Fixes
        run: |
          # The critical Mesa fix for Android/Winlator:
          # 1. Force use of memfd instead of shm_open (Android lacks /dev/shm)
          # 2. Fix potential SHM build errors in util code
          echo "Applying SHM and Android optimizations..."
          sed -i 's/USE_POSIX_SHM/USE_MEMFD/g' src/util/os_file.c 2>/dev/null || true
          
          # Fix for missing shm_open in some NDK-like environments
          # This ensures that Gallium will fall back to memfd safely.
          sed -i '/#include <sys\/mman.h>/a #include <linux/memfd.h>' src/util/os_file.c 2>/dev/null || true

      - name: Configure Mesa (LLVMpipe)
        run: |
          # Create a cross-file using the stable /usr/aarch64-linux-gnu sysroot
          cat <<EOF > cross-aarch64.txt
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'aarch64-linux-gnu-pkg-config'
          # We use a custom llvm-config wrapper to ensure it returns target paths
          llvm-config = '/usr/bin/aarch64-linux-gnu-llvm-config-15'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          sys_root = '/usr/aarch64-linux-gnu'
          # Tell pkg-config where to find the target libraries
          pkg_config_libdir = '/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig'
          EOF
          
          # Create the llvm-config-15 wrapper if it doesn't exist
          if [ ! -f /usr/bin/aarch64-linux-gnu-llvm-config-15 ]; then
            sudo ln -s /usr/lib/llvm-15/bin/llvm-config /usr/bin/aarch64-linux-gnu-llvm-config-15
          fi

          meson setup build \
            --cross-file cross-aarch64.txt \
            --prefix=/usr \
            -Dplatforms=x11,surfaceless \
            -Dgallium-drivers=swrast \
            -Dvulkan-drivers=swrast \
            -Dllvm=enabled \
            -Dshared-llvm=disabled \
            -Dbuildtype=release \
            -Degl=enabled \
            -Dgbm=enabled \
            -Dopengl=true \
            -Dosmesa=true \
            -Dglx=dri

      - name: Build and Package
        run: |
          ninja -C build
          
          # --- OpenGL LLVMpipe ---
          # Winlator expects the driver to be named llvmpipe_dri.so in usr/lib
          mkdir -p output/opengl/usr/lib
          if [ -f build/src/gallium/targets/dri/swrast_dri.so ]; then
            cp build/src/gallium/targets/dri/swrast_dri.so output/opengl/usr/lib/llvmpipe_dri.so
          else
            cp build/src/gallium/targets/dri/libgallium_dri.so output/opengl/usr/lib/llvmpipe_dri.so
          fi
          
          # Add symlink for compatibility
          ln -s llvmpipe_dri.so output/opengl/usr/lib/swrast_dri.so
          
          cd output/opengl && tar -cf - . | zstd -22 > ../llvmpipe-opengl-${{ github.event.inputs.mesa_version }}.tzst && cd ..

          # --- Vulkan LLVMpipe (Lavapipe) ---
          mkdir -p output/vulkan/usr/lib output/vulkan/usr/share/vulkan/icd.d
          cp build/src/gallium/targets/lavapipe/libvulkan_lvp.so output/vulkan/usr/lib/libvulkan_lvp.so
          
          # Generate the ICD JSON (The critical "Mesa fix" for loading Vulkan software rendering on Android)
          cat <<EOF > output/vulkan/usr/share/vulkan/icd.d/lvp_icd.aarch64.json
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "../../../lib/libvulkan_lvp.so",
                  "api_version": "1.3.255"
              }
          }
          EOF
          
          cd output/vulkan && tar -cf - . | zstd -22 > ../llvmpipe-vulkan-${{ github.event.inputs.mesa_version }}.tzst && cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvmpipe-drivers
          path: "*.tzst"
