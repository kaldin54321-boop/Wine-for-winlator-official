name: Build LLVMpipe Driver (Mesa)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version to build'
        required: true
        default: '24.1.0'

jobs:
  build-aarch64:
    # Use Ubuntu 22.04 (Jammy) for stable and compatible cross-compilation
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout Mesa
        run: |
          # Use official GitLab source to bypass GitHub mirror auth/404 issues
          git clone --depth 1 --branch mesa-${{ github.event.inputs.mesa_version }} https://gitlab.freedesktop.org/mesa/mesa.git .

      - name: Setup Multi-arch and Install Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          
          # Fix: Remove all existing sources to avoid "Malformed entry" and conflict errors
          sudo rm -rf /etc/apt/sources.list /etc/apt/sources.list.d/*
          
          # Create a clean sources.list with explicit architecture tagging
          cat <<EOF | sudo tee /etc/apt/sources.list
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          
          sudo apt-get update
          
          # Install dependencies. We separate llvm-15-dev (amd64) and libllvm15 (arm64) to avoid python3 conflict.
          sudo apt-get install -y \
            python3-pip python3-setuptools ninja-build build-essential flex bison pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libdrm-dev:arm64 libwayland-dev:arm64 libexpat1-dev:arm64 \
            libx11-dev:arm64 libxext-dev:arm64 libxfixes-dev:arm64 \
            libxcb1-dev:arm64 libxdamage-dev:arm64 libxshmfence-dev:arm64 \
            libxxf86vm-dev:arm64 libedit-dev:arm64 \
            llvm-15-dev libllvm15:arm64 \
            libunwind-dev:arm64 zlib1g-dev:arm64 zstd libzstd-dev:arm64
          
          # --- Meson Upgrade Fix ---
          # Ubuntu 22.04 default Meson is 0.61.2, but Mesa 24.1.0 requires >= 1.1.0.
          # We upgrade Meson and Mako via pip3.
          sudo pip3 install --upgrade meson mako

      - name: Apply Mesa Fixes for Android/Winlator
        run: |
          # 1. SHM/Memfd Fix: Force use of memfd_create instead of shm_open.
          # Required for Android as it lacks /dev/shm.
          echo "Applying native rendering optimizations..."
          sed -i 's/USE_POSIX_SHM/USE_MEMFD/g' src/util/os_file.c 2>/dev/null || true
          
          # 2. Add missing headers for memfd constants
          sed -i '/#include <sys\/mman.h>/a #include <linux/memfd.h>' src/util/os_file.c 2>/dev/null || true
          
          # 3. CPU Detection Fix: Avoid failing platform checks during cross-build
          sed -i 's/detect_pci_device/false/g' src/gallium/auxiliary/util/u_cpu_detect.c 2>/dev/null || true

      - name: Configure Mesa (LLVMpipe)
        run: |
          # Create an llvm-config wrapper for cross-compilation
          cat <<EOF | sudo tee /usr/bin/aarch64-llvm-config
          #!/bin/bash
          /usr/bin/llvm-config-15 "\$@" | sed 's|-L/usr/lib/x86_64-linux-gnu|-L/usr/lib/aarch64-linux-gnu|g'
          EOF
          sudo chmod +x /usr/bin/aarch64-llvm-config

          # Create the cross-file pointing to the arm64 sysroot
          cat <<EOF > cross-aarch64.txt
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'aarch64-linux-gnu-pkg-config'
          llvm-config = '/usr/bin/aarch64-llvm-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          sys_root = '/usr/aarch64-linux-gnu'
          pkg_config_libdir = '/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig'
          EOF

          # Ensure the upgraded Meson is in PATH (usually /usr/local/bin)
          export PATH="/usr/local/bin:$PATH"

          meson setup build \
            --cross-file cross-aarch64.txt \
            --prefix=/usr \
            -Dplatforms=x11,surfaceless \
            -Dgallium-drivers=swrast \
            -Dvulkan-drivers=swrast \
            -Dllvm=enabled \
            -Dshared-llvm=disabled \
            -Dbuildtype=release \
            -Degl=enabled \
            -Dgbm=enabled \
            -Dopengl=true \
            -Dosmesa=true \
            -Dglx=dri

      - name: Build and Package
        run: |
          ninja -C build
          
          # --- OpenGL LLVMpipe ---
          mkdir -p output/opengl/usr/lib
          if [ -f build/src/gallium/targets/dri/swrast_dri.so ]; then
            cp build/src/gallium/targets/dri/swrast_dri.so output/opengl/usr/lib/llvmpipe_dri.so
          else
            cp build/src/gallium/targets/dri/libgallium_dri.so output/opengl/usr/lib/llvmpipe_dri.so
          fi
          
          # Symlink for compatibility
          ln -s llvmpipe_dri.so output/opengl/usr/lib/swrast_dri.so
          
          cd output/opengl && tar -cf - . | zstd -22 > ../../llvmpipe-opengl-${{ github.event.inputs.mesa_version }}.tzst && cd ..

          # --- Vulkan LLVMpipe (Lavapipe) ---
          mkdir -p output/vulkan/usr/lib output/vulkan/usr/share/vulkan/icd.d
          cp build/src/gallium/targets/lavapipe/libvulkan_lvp.so output/vulkan/usr/lib/libvulkan_lvp.so
          
          # Generate the ICD JSON Fix (Mandatory for software Vulkan on Android)
          cat <<EOF > output/vulkan/usr/share/vulkan/icd.d/lvp_icd.aarch64.json
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "../../../lib/libvulkan_lvp.so",
                  "api_version": "1.3.255"
              }
          }
          EOF
          
          cd output/vulkan && tar -cf - . | zstd -22 > ../llvmpipe-vulkan-${{ github.event.inputs.mesa_version }}.tzst && cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvmpipe-drivers
          path: "*.tzst"
