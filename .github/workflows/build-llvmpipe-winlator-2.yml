name: Build LLVMpipe Driver (Mesa)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version to build'
        required: true
        default: '24.1.0'

jobs:
  build-aarch64:
    # Use Ubuntu 24.04 (Noble) for modern dependencies (libdrm >= 2.4.119)
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout Mesa
        run: |
          # Use official GitLab source to bypass GitHub mirror authentication issues
          git clone --depth 1 --branch mesa-${{ github.event.inputs.mesa_version }} https://gitlab.freedesktop.org/mesa/mesa.git .

      - name: Setup Multi-arch and Install Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          
          # Clean up sources to avoid "Malformed entry" and conflict errors
          sudo rm -rf /etc/apt/sources.list /etc/apt/sources.list.d/*
          
          # Create a clean multi-arch sources.list for Ubuntu 24.04
          cat <<EOF | sudo tee /etc/apt/sources.list
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF
          
          sudo apt-get update
          
          # Install dependencies. Separating amd64 and arm64 packages to prevent Python3 conflicts.
          sudo apt-get install -y \
            python3-pip python3-setuptools ninja-build build-essential flex bison pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libdrm-dev:arm64 libwayland-dev:arm64 libexpat1-dev:arm64 \
            libx11-dev:arm64 libxext-dev:arm64 libxfixes-dev:arm64 \
            libxcb1-dev:arm64 libxdamage-dev:arm64 libxshmfence-dev:arm64 \
            libxxf86vm-dev:arm64 libedit-dev:arm64 \
            llvm-17-dev libllvm17:arm64 \
            libunwind-dev:arm64 zlib1g-dev:arm64 zstd libzstd-dev:arm64 \
            wayland-protocols glslang-tools libglvnd-dev:arm64
          
          # Upgrade Meson and Mako to ensure compatibility with Mesa 24.1.0
          sudo pip3 install --upgrade meson mako ply

      - name: Apply Mesa Fixes for Android/Winlator
        run: |
          # --- Mandatory Android "Mesa Fix" ---
          # Force use of memfd_create instead of shm_open. 
          # Android kernels lack /dev/shm, so drivers using POSIX SHM will fail.
          echo "Applying memfd/SHM optimization..."
          sed -i 's/USE_POSIX_SHM/USE_MEMFD/g' src/util/os_file.c 2>/dev/null || true
          sed -i '/#include <sys\/mman.h>/a #include <linux/memfd.h>' src/util/os_file.c 2>/dev/null || true
          
          # Avoid failing platform checks during cross-build initialization
          sed -i 's/detect_pci_device/false/g' src/gallium/auxiliary/util/u_cpu_detect.c 2>/dev/null || true

      - name: Configure Mesa (LLVMpipe)
        run: |
          # --- Create robust wrappers for cross-compilation ---
          
          # 1. Pkg-Config Wrapper (Essential for finding arm64 libs)
          cat <<EOF | sudo tee /usr/bin/aarch64-linux-gnu-pkg-config
#!/bin/bash
export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
exec pkg-config "\$@"
EOF
          sudo chmod +x /usr/bin/aarch64-linux-gnu-pkg-config

          # 2. LLVM Config Wrapper
          cat <<EOF | sudo tee /usr/bin/aarch64-llvm-config
#!/bin/bash
/usr/bin/llvm-config-17 "\$@" | sed 's|-L/usr/lib/x86_64-linux-gnu|-L/usr/lib/aarch64-linux-gnu|g'
EOF
          sudo chmod +x /usr/bin/aarch64-llvm-config

          # Create the cross-file pointing to the arm64 environment
          cat <<EOF > cross-aarch64.txt
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkg-config = '/usr/bin/aarch64-linux-gnu-pkg-config'
          llvm-config = '/usr/bin/aarch64-llvm-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          pkg_config_libdir = '/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig'
          EOF

          # Ensure the upgraded Meson is used
          export PATH="/usr/local/bin:$PATH"

          meson setup build \
            --cross-file cross-aarch64.txt \
            --prefix=/usr \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=swrast \
            -Dvulkan-drivers=swrast \
            -Dllvm=enabled \
            -Dshared-llvm=disabled \
            -Dbuildtype=release \
            -Degl=enabled \
            -Dgbm=enabled \
            -Dopengl=true \
            -Dosmesa=true \
            -Dglx=dri \
            -Dglvnd=disabled

      - name: Build and Package
        run: |
          export PATH="/usr/local/bin:$PATH"
          ninja -C build
          
          # --- OpenGL LLVMpipe ---
          # Winlator expects llvmpipe_dri.so in usr/lib
          mkdir -p output/opengl/usr/lib
          if [ -f build/src/gallium/targets/dri/swrast_dri.so ]; then
            cp build/src/gallium/targets/dri/swrast_dri.so output/opengl/usr/lib/llvmpipe_dri.so
          else
            cp build/src/gallium/targets/dri/libgallium_dri.so output/opengl/usr/lib/llvmpipe_dri.so
          fi
          
          # Add symlink for compatibility
          ln -s llvmpipe_dri.so output/opengl/usr/lib/swrast_dri.so
          
          cd output/opengl && tar -cf - . | zstd -22 > ../../llvmpipe-opengl-${{ github.event.inputs.mesa_version }}.tzst && cd ..

          # --- Vulkan LLVMpipe (Lavapipe) ---
          mkdir -p output/vulkan/usr/lib output/vulkan/usr/share/vulkan/icd.d
          cp build/src/gallium/targets/lavapipe/libvulkan_lvp.so output/vulkan/usr/lib/libvulkan_lvp.so
          
          # Generate the ICD JSON Fix (Mandatory for software Vulkan on Android)
          cat <<EOF > output/vulkan/usr/share/vulkan/icd.d/lvp_icd.aarch64.json
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "../../../lib/libvulkan_lvp.so",
                  "api_version": "1.3.255"
              }
          }
          EOF
          
          cd output/vulkan && tar -cf - . | zstd -22 > ../llvmpipe-vulkan-${{ github.event.inputs.mesa_version }}.tzst && cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvmpipe-drivers
          path: "*.tzst"
